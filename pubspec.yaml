name: africonnect
description: AfriConnect - Social media platform for Africa
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  cached_network_image: ^3.3.0
  flutter_dotenv: ^5.1.0
  fl_chart: ^0.66.0
  
  # Media
  image_picker: ^1.0.4
  video_player: ^2.8.0
  
  # Utilities
  intl: ^0.20.2
  timeago: ^3.6.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.1
  
  # Live Streaming
  livekit_client: ^1.0.0
  
  # Local Storage (offline cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/icons/